<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Personagens Low Poly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header>
    <div>
      <h1>Personagens Low Poly</h1>
      <p class="sub" id="charName"></p>
    </div>
    <div class="count" id="count">Contando triângulos…</div>
  </header>

  <div class="tabs-bar" id="tabsBar">
    <span class="tabs-title" id="personagens-label">Personagens</span>
    <div class="tabs" id="personagens" role="tablist" aria-labelledby="personagens-label"></div>
  </div>

  <div id="stage"></div>

  <footer>
    <div class="btns" id="viewerBtns">
      <button type="button" id="btnPlay" class="primary">Jogar</button>
      <button type="button" id="btnWave">Acenar</button>
      <button type="button" id="btnWalk" aria-pressed="false">Andar</button>
      <button type="button" id="btnRun" aria-pressed="false">Correr</button>
      <button type="button" id="btnSpin" aria-pressed="true">Girar sozinha</button>
      <button type="button" id="btnWire" aria-pressed="false">Aramado</button>
      <button type="button" id="btnIn" aria-label="Aproximar">Aproximar</button>
      <button type="button" id="btnOut" aria-label="Afastar">Afastar</button>
      <button type="button" id="btnReset">Recentralizar</button>
    </div>
    <span class="hint" id="viewerHint">Arraste para girar · role para aproximar</span>
    <div class="btns" id="playBtns" hidden>
      <button type="button" id="btnFull" aria-pressed="false">Tela cheia</button>
      <button type="button" id="btnExit">Sair</button>
    </div>
    <span class="hint" id="playHint" hidden>W A S D para andar · Shift para correr · Espaço para pular · setas ou arrastar: gira a câmera (olhe para cima para ver o teto) · F tela cheia · Esc para sair</span>
  </footer>
</div>

<div class="overlay" id="menuJogo" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="menuTitulo">
    <h2 id="menuTitulo">Escolha o ambiente</h2>
    <div class="env-list">
      <button type="button" class="env" data-env="sala-vazia">Sala vazia</button>
    </div>
    <button type="button" id="btnCloseMenu">Cancelar</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>

</body>
</html>
